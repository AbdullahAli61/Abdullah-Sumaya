:root{
  --k:#111111;--w:#FFFDF7;--sky:#65C4E8;--pink:#F04491;--yel:#FFE45C;--lav:#A8A5F0;--grn:#70D34E;
  --red:#E8323C;--org:#FF8A3D;--navy:#1B1340;--teal:#2BC4B4;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:"Unixel","Press Start 2P",monospace;
  font-size:32px;line-height:1.45;color:var(--k);background:var(--yel);
  -webkit-font-smoothing:none;-moz-osx-font-smoothing:grayscale;font-smooth:never;text-rendering:optimizeSpeed;
  overflow-x:hidden;
}
img,canvas,.sp{image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
.sp{display:inline-block;vertical-align:middle;max-width:none;flex:none}
button,input{font:inherit;color:inherit}
.small{font-size:16px;line-height:1.6}
.en{font-size:16px;letter-spacing:0}

/* ---------- shared pixel UI ---------- */
.pxb{
  display:inline-flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;
  background:var(--yel);border:4px solid var(--k);box-shadow:6px 6px 0 var(--k);
  padding:8px 20px;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  transition:none;
}
.pxb{text-decoration:none;color:var(--k)}
.pxb.pink,.pxb.jump{color:var(--w)}
.pxb:active,.pxb.on{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--k)}
.pxb:focus-visible{outline:4px dashed var(--k);outline-offset:4px}
.pxb.pink{background:var(--pink);color:var(--w)}
.pxb.green{background:var(--grn)}
.pxb.sky{background:var(--sky)}
.pxb.big{padding:12px 28px}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.bob{animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.twinkle{animation:tw 1.4s steps(1) infinite}
@keyframes tw{0%{opacity:1}50%{opacity:.15}}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(calc(100vw + 200px))}}

.checker{background:repeating-conic-gradient(var(--c1) 0 25%,var(--c2) 0 50%) 0 0/48px 48px}

/* ---------- HERO ---------- */
#hero{
  --c1:#65C4E8;--c2:#7ACDEE;
  position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;
  padding:20px 14px 36px;overflow:hidden;
}
#hero .wall,#hero .clouds{position:absolute;inset:0;pointer-events:none}
#hero .wall .sp{position:absolute}
#hero .clouds .sp{position:absolute;animation:drift 60s steps(80) infinite}
.frame{
  position:relative;z-index:2;width:min(100%,760px);background:var(--w);
  border:6px solid var(--k);box-shadow:10px 10px 0 var(--k);padding:22px 18px 30px;text-align:center;
}
.frame>i.c{position:absolute;width:16px;height:16px;background:var(--pink);border:4px solid var(--k)}
.frame>i.c1{top:-14px;right:-14px}.frame>i.c2{top:-14px;left:-14px}
.frame>i.c3{bottom:-14px;right:-14px}.frame>i.c4{bottom:-14px;left:-14px}
.brand{
  display:inline-flex;align-items:center;gap:10px;direction:ltr;background:var(--yel);
  border:4px solid var(--k);box-shadow:4px 4px 0 var(--k);padding:2px 12px;margin-bottom:14px;
}
.brand b{font-weight:400;font-size:32px}
.title{font-size:48px;line-height:1.3;font-weight:400;margin:6px 0 4px}
.title .hl{
  display:inline-block;background:var(--pink);color:var(--w);padding:0 16px;
  border:4px solid var(--k);box-shadow:6px 6px 0 var(--k);text-shadow:4px 4px 0 var(--k);
}
.sub{background:var(--lav);display:inline-block;border:4px solid var(--k);padding:4px 14px;margin:16px 0 8px;box-shadow:4px 4px 0 var(--k)}
.potion{position:relative;display:grid;place-items:center;margin:14px auto 8px;height:210px}
.potion .sp.main{animation:bob 1.6s steps(2) infinite}
.potion .spk{position:absolute}
.start-btn{margin-top:10px;flex-direction:column;gap:2px;font-size:32px}
.start-btn .en{font-size:16px;color:var(--w);background:var(--k);padding:2px 8px}

/* ---------- GAME ---------- */
#game{
  position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  background:#0E0B26;color:var(--w);border-top:8px solid var(--k);border-bottom:8px solid var(--k);overflow:hidden;
}
#game .sidebg{position:absolute;inset:0;background-size:256px 384px;opacity:1;z-index:0;image-rendering:pixelated}
.hud{
  position:relative;z-index:3;direction:ltr;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 14px;background:#111;border-bottom:4px solid var(--pink);
}
.hud .l,.hud .r,.hud .c{display:flex;align-items:center;gap:6px}
.hud .c{color:var(--yel);font-size:16px;letter-spacing:0;white-space:nowrap}
@media (max-width:560px){.hud .c{display:none}}
.hud .num{font-size:32px;line-height:1;min-width:64px;text-align:left}
.hud .pxb{padding:2px 8px;box-shadow:4px 4px 0 #444;border-color:#000}
.stagewrap{position:relative;z-index:2;flex:1 1 0;min-height:0}
.cvbox{position:absolute;inset:0;display:grid;place-items:center}
.screen{position:relative;border:4px solid #000;box-shadow:0 0 0 4px var(--pink),8px 8px 0 4px #000;background:#000}
.screen canvas{display:block;width:100%;height:100%}
.ov{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  text-align:center;padding:14px;background:rgba(20,12,70,.78);
}
.ov[hidden]{display:none}
.ov h3{font-size:32px;font-weight:400;color:var(--yel);text-shadow:4px 4px 0 #000;line-height:1.3}
.ov p{font-size:16px;line-height:1.7;max-width:34ch}
.ov .pxb{color:var(--k)}
.kbhint{position:relative;z-index:3;text-align:center;padding:10px 12px 14px;background:#111;color:var(--lav);border-top:4px solid var(--pink)}
.kbhint kbd{font:inherit;background:var(--w);color:var(--k);border:3px solid var(--k);padding:0 8px;margin:0 3px;box-shadow:3px 3px 0 #555}

/* touch controls */
.controls{
  display:none;position:relative;z-index:3;direction:ltr;justify-content:space-between;align-items:flex-end;
  padding:10px 14px max(14px,env(safe-area-inset-bottom));background:#111;border-top:4px solid var(--pink);touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px)}
.dpad .pxb{width:58px;height:58px;padding:0;box-shadow:4px 4px 0 #444;background:var(--sky)}
.dpad .pxb:active,.dpad .pxb.on{transform:translate(3px,3px);box-shadow:1px 1px 0 #444}
.dpad .up{grid-column:2;grid-row:1}.dpad .lf{grid-column:1;grid-row:2}
.dpad .rt{grid-column:3;grid-row:2}.dpad .dn{grid-column:2;grid-row:3}
.dpad .mid{grid-column:2;grid-row:2;background:#333;border:4px solid #000}
.dpad img.rot90{transform:rotate(90deg)}.dpad img.rot180{transform:rotate(180deg)}.dpad img.rot270{transform:rotate(270deg)}
.jump{
  width:112px;height:112px;border-radius:0;background:var(--red);color:var(--w);flex-direction:column;gap:0;
  font-size:32px;line-height:1.1;box-shadow:6px 6px 0 #444;border-color:#000;
  clip-path:polygon(0 24px,8px 24px,8px 12px,12px 12px,12px 8px,24px 8px,24px 0,calc(100% - 24px) 0,calc(100% - 24px) 8px,calc(100% - 12px) 8px,calc(100% - 12px) 12px,calc(100% - 8px) 12px,calc(100% - 8px) 24px,100% 24px,100% calc(100% - 24px),calc(100% - 8px) calc(100% - 24px),calc(100% - 8px) calc(100% - 12px),calc(100% - 12px) calc(100% - 12px),calc(100% - 12px) calc(100% - 8px),calc(100% - 24px) calc(100% - 8px),calc(100% - 24px) 100%,24px 100%,24px calc(100% - 8px),12px calc(100% - 8px),12px calc(100% - 12px),8px calc(100% - 12px),8px calc(100% - 24px),0 calc(100% - 24px));
  box-shadow:none;border-width:0;outline:none;
}
.jump .en{color:var(--yel)}
.jump:active,.jump.on{transform:translate(3px,3px);filter:brightness(.85)}
@media (pointer:coarse),(max-width:760px){.controls{display:flex}.kbhint{display:none}}
@media (max-width:380px){.dpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px)}.dpad .pxb{width:52px;height:52px}.jump{width:100px;height:100px}}

/* ---------- LOCKED ---------- */
#locked{--c1:#F04491;--c2:#FF5FA4;padding:44px 16px;display:grid;place-items:center}
#locked .card{
  background:var(--w);border:6px solid var(--k);box-shadow:10px 10px 0 var(--k);padding:22px 20px;max-width:720px;width:100%;
  display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
}
#locked .card .row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
#locked h2{font-weight:400;font-size:32px;line-height:1.45}
#locked h2 span{background:var(--yel);padding:0 8px;border:4px solid var(--k)}

/* ---------- INVITATION ---------- */
#invitation{--c1:#FFE45C;--c2:#FFEE8F;padding:48px 14px 64px;position:relative;overflow:hidden}
#invitation[hidden]{display:none}
.inv{position:relative;z-index:2;max-width:760px;margin:0 auto}
.inv-wall{position:absolute;inset:0;pointer-events:none;z-index:0}
.inv-wall .sp{position:absolute}
.inv-card{background:var(--w);border:6px solid var(--k);box-shadow:10px 10px 0 var(--k);padding:22px 16px 26px;text-align:center;margin-bottom:34px}
.inv-head{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:12px}
.inv-head .icons{display:flex;gap:6px;justify-content:center;align-items:flex-end}
.inv-head h2{font-weight:400;font-size:48px;line-height:1.3}
.inv-head h2 span{background:var(--pink);color:var(--w);padding:0 14px;border:4px solid var(--k);box-shadow:6px 6px 0 var(--k);text-shadow:4px 4px 0 var(--k);display:inline-block}
.info{display:flex;flex-direction:column;gap:16px;margin:20px 0}
.info .it{display:flex;align-items:center;gap:14px;text-align:right;border:4px solid var(--k);padding:10px 14px;box-shadow:5px 5px 0 var(--k)}
.info .it:nth-child(1){background:var(--sky)}
.info .it:nth-child(2){background:var(--grn)}
.info .it:nth-child(3){background:var(--lav)}
.info .it .t{flex:1;min-width:0}
.map-btn{width:100%;margin-top:4px;background:var(--yel)}
.warn{display:flex;align-items:center;gap:12px;justify-content:center;background:var(--red);color:var(--w);border:4px solid var(--k);box-shadow:5px 5px 0 var(--k);padding:10px 14px;margin-top:18px;text-align:center}
.rsvp{background:var(--w);border:6px solid var(--k);box-shadow:10px 10px 0 var(--k);padding:22px 16px 26px}
.rsvp h3{font-weight:400;font-size:32px;text-align:center;margin-bottom:16px;line-height:1.4}
.rsvp h3 .sp{margin-inline:6px}
.field{margin-bottom:18px}
.field>label,.field>.lbl{display:block;margin-bottom:6px;background:var(--k);color:var(--yel);padding:0 10px;width:max-content;max-width:100%}
.field input[type=text]{
  width:100%;background:#fff;border:4px solid var(--k);box-shadow:inset 4px 4px 0 #ddd;padding:6px 12px;outline:none;border-radius:0;
}
.field input[type=text]:focus{background:#FFF8C2;box-shadow:inset 4px 4px 0 #eee,0 0 0 4px var(--pink)}
.field.err input{background:#FFD0D6;animation:shake .35s steps(4)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.stepper{display:flex;align-items:center;gap:12px;direction:ltr;justify-content:center}
.stepper .pxb{width:64px;height:64px;padding:0;font-size:32px;background:var(--sky)}
.stepper output{min-width:96px;text-align:center;background:#fff;border:4px solid var(--k);padding:4px 10px;box-shadow:inset 4px 4px 0 #ddd}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices input{position:absolute;opacity:0;pointer-events:none}
.choices label{
  display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;cursor:pointer;padding:8px 6px;line-height:1.25;
  border:4px solid var(--k);background:#fff;box-shadow:5px 5px 0 var(--k);user-select:none;-webkit-user-select:none;
}
.choices input:checked+label.yes{background:var(--grn)}
.choices input:checked+label.no{background:var(--lav)}
.choices input:checked+label{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--k)}
.choices input:focus-visible+label{outline:4px dashed var(--k);outline-offset:4px}
.choices label .tick{width:16px;height:16px;border:3px solid var(--k);background:#fff;flex:none}
.choices input:checked+label .tick{background:var(--k)}
.send{width:100%;margin-top:6px;background:#25D366;color:var(--k);font-size:32px}
.fallback{margin-top:14px;text-align:center}
.fallback a{color:var(--k);background:var(--yel);border:3px solid var(--k);padding:0 8px;text-decoration:none}

/* ---------- footer ---------- */
footer{background:var(--grn);border-top:8px solid var(--k);padding:30px 14px 40px;text-align:center}
footer .row{display:flex;justify-content:center;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}

/* ---------- modal / toast / confetti ---------- */
.modal{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:16px;background:rgba(17,17,17,.7)}
.modal[hidden]{display:none}
.modal .box{
  background:var(--yel);border:6px solid var(--k);box-shadow:10px 10px 0 var(--k);padding:26px 18px 22px;max-width:560px;width:100%;
  text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;animation:pop .5s steps(5) both;
}
.modal h2{font-weight:400;font-size:48px;line-height:1.25;text-shadow:4px 4px 0 var(--w)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.confetti{position:fixed;inset:0;z-index:1001;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-24px;width:12px;height:12px;border:3px solid var(--k);animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh)}}
.toast{
  position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:1100;max-width:calc(100vw - 24px);
  background:var(--k);color:var(--yel);border:4px solid var(--w);box-shadow:6px 6px 0 var(--pink);padding:8px 16px;text-align:center;
}
.toast[hidden]{display:none}

@media (min-width:720px){
  .title{font-size:64px}
  .inv-head h2{font-size:64px}
  .modal h2{font-size:64px}
  #game .hud{padding:10px 24px}
}
@media (max-width:520px){.choices{grid-template-columns:1fr}.choices label{justify-content:flex-start;padding:8px 14px}}
@media (max-width:400px){
  body{font-size:32px}
  .title{font-size:48px}
  .title .hl{padding:0 8px}
  .inv-head h2{font-size:32px}
  .modal h2{font-size:32px}
  .info .it{padding:8px 10px;gap:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

function mk(rows,remap){

  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){let ch=r[i];if(ch==='.'||ch===' ')continue;if(remap&&remap[ch])ch=remap[ch];x.fillStyle=PAL[ch]||'#f0f';x.fillRect(i,j,1,1)}});
  return c;
}
const cache={};
function spr(name,remap){const key=name+(remap?JSON.stringify(remap):'');return cache[key]||(cache[key]=mk(SP[name],remap))}
function parseRemap(s){if(!s)return null;const o={};s.split(',').forEach(p=>{const [a,b]=p.split(':');o[a]=b});return o}
function hydrate(root){

    const im=new Image();im.src=c.toDataURL();im.width=c.width*z;im.height=c.height*z;im.alt='';im.setAttribute('aria-hidden','true');
    im.className=('sp '+(el.className||'')).trim();im.style.cssText=el.style.cssText;

}

let ac=null,muted=false;
function initAudio(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!ac)ac=new A();if(ac.state==='suspended')ac.resume()}
function tone(f1,f2,dur,type='square',vol=.07,when=0){
  if(!ac||muted)return;const t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);if(f2&&f2!==f1)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.03);
}
function noise(dur,vol=.1){
  if(!ac||muted)return;const n=ac.sampleRate*dur|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;g.gain.value=vol;s.connect(g);g.connect(ac.destination);s.start();
}

function resetGame(full){

function respawn(){P.x=P.cpX;P.y=P.cpY;P.vx=P.vy=0;P.ground=true;P.lad=null;P.kb=0;P.inv=2}
function say(txt,x,y,col){floaters.push({txt,x,y,t:0,col:col||'#FFE45C'})}
function burst(x,y,n,cols){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=30+Math.random()*60;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,t:0,life:.7+Math.random()*.5,c:cols[(Math.random()*cols.length)|0],type:'sq'})}}

function hit(h){
  SFX.hit();P.hearts--;P.inv=1.9;
  burst(P.x,P.y-8,10,['#FF8A3D','#FFE45C','#E8323C']);
  if(P.hearts<=0){say('TRY AGAIN!',P.x,P.y-34,'#FF9CC8');P.hearts=3;setHearts(3);respawn();return}
  setHearts(P.hearts);say('OOPS!',P.x,P.y-30,'#FF9CC8');
  P.lad=null;P.ground=false;P.vx=(P.x<h.x?-1:1)*76;P.vy=-150;P.kb=.28;
}
function win(){
  if(G.state!=='playing')return;G.state='won';
  P.face=P.x<BR.x?1:-1;
  for(let i=0;i<70;i++){const a=Math.random()*6.283,s=25+Math.random()*95;parts.push({x:BR.x,y:FL[4]-20,vx:Math.cos(a)*s,vy:Math.sin(a)*s-45,t:0,life:1.4+Math.random()*1.4,c:['p','y','b','l','g'][i%5],type:'heart'})}
  SFX.fanfare();unlockInvitation();
  setTimeout(showWin,1700);
}

function update(dt){
  G.time+=dt;
  flies.forEach(f=>{f.ph+=dt;f.x+=Math.cos(f.ph*.9+f.c)*f.sp*dt;f.y+=Math.sin(f.ph*1.3)*f.sp*dt;if(f.x<0)f.x=W;if(f.x>W)f.x=0;if(f.y<30)f.y=30;if(f.y>370)f.y=370});
  for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.type==='heart'?40:140)*dt}
  parts=parts.filter(p=>p.t<p.life);
  for(const f of floaters){f.t+=dt;f.y-=14*dt}
  floaters=floaters.filter(f=>f.t<1.1);
  if(G.state==='won'){P.anim+=dt*6;return}
  if(G.state!=='playing')return;
  hazards.forEach(h=>{h.x+=h.dir*h.sp*dt;if(h.x<12){h.x=12;h.dir=1}else if(h.x>W-12){h.x=W-12;h.dir=-1}});
  if(P.inv>0)P.inv-=dt;
  const L=P.lad;
  if(L){
    const dir=(keys.down?1:0)-(keys.up?1:0);
    P.y+=dir*CLIMB*dt;P.x=L.cx;P.anim+=Math.abs(dir)*dt*7;
    if(dir&&((P.anim*2)|0)%2===0&&Math.random()<.07)SFX.tick();
    if(P.y<=L.top){P.y=L.top;P.lad=null;P.ground=true;arrive(L.up,L.cx)}
    else if(P.y>=L.bot){P.y=L.bot;P.lad=null;P.ground=true}
  }else{
    const dx=(keys.right?1:0)-(keys.left?1:0);
    if(P.kb>0)P.kb-=dt;else{P.vx=dx*SPEED;if(dx)P.face=dx;P.anim+=Math.abs(dx)*dt*8}
    P.x=Math.max(8,Math.min(W-8,P.x+P.vx*dt));
    if(P.ground)P.coy=.1;else P.coy-=dt;
    P.jb-=dt;
    if(P.jb>0&&P.coy>0&&P.kb<=0){P.vy=JUMPV;P.ground=false;P.coy=0;P.jb=0;SFX.jump()}
    if(!P.ground){
      const py=P.y;P.vy+=GRAV*dt;P.y+=P.vy*dt;
      if(P.vy>=0)for(let i=0;i<FL.length;i++){const fy=FL[i];if(py<=fy+.01&&P.y>=fy){P.y=fy;P.vy=0;P.ground=true;if(i>P.floor)arrive(i,P.x);break}}
    }
    // grab a vine
    for(const l of LAD){
      if(Math.abs(P.x-l.cx)>10)continue;
      if(keys.up&&P.y<=l.bot+1&&P.y>l.top+2&&(P.ground||P.vy>-40)){grab(l);break}
      if(keys.down&&P.ground&&P.y>=l.top-1&&P.y<l.bot-2){grab(l);P.y=l.top+2;break}
    }
  }
  // stars
  for(const s of stars){if(s.got)continue;const sy=FL[s.f]-21+Math.sin(G.time*3+s.x)*2;
    if(Math.abs(P.x-s.x)<10&&P.y-15<sy+5&&P.y>sy-5){s.got=true;P.stars++;SFX.star();say('+1',s.x,sy-8,'#FFE45C');burst(s.x,sy,8,['#FFE45C','#FFFDF7']);$('#starNum').textContent=P.stars+'/'+NSTARS}}
  // hazards
  if(P.inv<=0)for(const h of hazards){
    const fy=FL[h.f]-(h.hop?Math.abs(Math.sin(G.time*3+h.ph))*h.hop:0);
    if(Math.abs(h.x-P.x)<9&&P.y-14<fy-1&&P.y-1>fy-10){hit(h);break}
  }
  // victory
  if(P.ground&&!P.lad&&P.y===FL[4]&&Math.abs(P.x-BR.x)<14)win();
}
function arrive(i,x){if(i>P.floor)P.floor=i;if(i>=P.floor){P.cpX=x;P.cpY=FL[i]}}
function grab(l){P.lad=l;P.x=l.cx;P.vx=0;P.vy=0;P.ground=false}

/* ---------- drawing ---------- */
function draw(){
  const x=ctx;x.imageSmoothingEnabled=false;
  x.drawImage(staticLayer,0,0);
  // fireflies
  flies.forEach(f=>{const a=.55+.45*Math.sin(f.ph*3);const px=Math.round(f.x),py=Math.round(f.y);
    x.globalAlpha=.25*a;x.fillStyle='#E7FF6A';x.fillRect(px-2,py-2,5,5);x.globalAlpha=a;x.fillStyle='#F6FFB0';x.fillRect(px,py,2,2);x.globalAlpha=1});
  // fairy lights
  bulbs.forEach((b,i)=>{const on=((G.time*2+i)|0)%3!==0;x.globalAlpha=on?.28:.1;x.fillStyle=b.c;x.fillRect(b.x-3,b.y-2,8,8);x.globalAlpha=1;x.fillStyle=on?b.c:'#555';x.fillRect(b.x-1,b.y,3,4);x.fillStyle='#111';x.fillRect(b.x-1,b.y-1,3,1)});
  // stars
  stars.forEach(s=>{if(s.got)return;const sy=FL[s.f]-21+Math.sin(G.time*3+s.x)*2;const tw=((G.time*4+s.x)|0)%2;x.drawImage(spr('sparkle',tw?{y:'w'}:null),Math.round(s.x-5),Math.round(sy-5))});
  // bride + glowing heart
  const bb=spr('bride');x.drawImage(bb,BR.x-7,FL[4]-bb.height+1+(G.state==='won'?-Math.abs(Math.sin(P.anim))*3|0:0));
  {const hy=FL[4]-bb.height-12+Math.round(Math.sin(G.time*3)*2),pu=.5+.5*Math.sin(G.time*5);
   x.globalAlpha=.18+.2*pu;x.fillStyle='#FF9CC8';x.fillRect(BR.x-10,hy-3,20,18);x.globalAlpha=.25;x.fillRect(BR.x-8,hy-5,16,22);x.globalAlpha=1;
   const hs=spr('heartS');x.drawImage(hs,BR.x-hs.width,hy-2,hs.width*2,hs.height*2)}
  // hazards
  hazards.forEach(h=>{
    const sp=spr(h.kind==='fire'?'fire':'thorn');const fy=FL[h.f]-(h.hop?Math.abs(Math.sin(G.time*3+h.ph))*h.hop:0);
    const fl=((G.time*7+h.ph)|0)%2;
    x.save();x.translate(Math.round(h.x),Math.round(fy)+1);if(fl)x.scale(-1,1);x.drawImage(sp,-(sp.width>>1),-sp.height);x.restore();
  });
  // groom
  if(!(P.inv>0&&((G.time*14)|0)%2===0)){
    const fr=(P.lad?((P.anim|0)%2):(P.ground&&(keys.left||keys.right)&&G.state==='playing'?((P.anim|0)%2):0));
    const sp=spr(fr?'groomB':'groomA');
    x.save();x.translate(Math.round(P.x),Math.round(P.y)+1);
    const flip=P.lad?(((P.anim*1.5)|0)%2?-1:1):P.face;
    x.scale(flip<0?-1:1,1);x.drawImage(sp,-(sp.width>>1),-sp.height-(fr&&!P.lad?1:0));x.restore();
  }
  // particles
  parts.forEach(p=>{
    if(p.type==='heart'){const s=spr('heartS',{p:p.c});x.globalAlpha=Math.min(1,(p.life-p.t)*2);x.drawImage(s,Math.round(p.x),Math.round(p.y));x.globalAlpha=1}
    else{x.globalAlpha=Math.min(1,(p.life-p.t)*3);x.fillStyle=p.c;x.fillRect(Math.round(p.x),Math.round(p.y),2,2);x.globalAlpha=1}
  });
  // floating text
  x.font='16px Unixel';x.textBaseline='top';x.textAlign='center';
  floaters.forEach(f=>{x.fillStyle='#111';x.fillText(f.txt,Math.round(f.x)+1,Math.round(f.y)+1);x.fillStyle=f.col;x.fillText(f.txt,Math.round(f.x),Math.round(f.y))});
}

/* ---------- loop + visibility ---------- */
let last=0,gameVisible=true,raf=0;
function loop(t){
  raf=requestAnimationFrame(loop);
  const dt=Math.min(.033,(t-last)/1000||0);last=t;
  if(document.hidden)return;
  if(G.state==='playing'&&!gameVisible){/* paused while scrolled away */}
  else update(dt);
  draw();
}
new IntersectionObserver(es=>{gameVisible=es[0].intersectionRatio>.25},{threshold:[0,.25,.5,1]}).observe($('#game'));

/* ---------- fit canvas ---------- */
function fit(){
  const wrap=$('#stagewrap'),aw=wrap.clientWidth-28,ah=wrap.clientHeight-28;
  let s=Math.min(aw/W,ah/H);if(s>=2)s=Math.floor(s);if(s<.5)s=.5;
  const sc=$('#screen');sc.style.width=Math.round(W*s)+'px';sc.style.height=Math.round(H*s)+'px';
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));

/* ---------- input ---------- */
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down'};
const typing=t=>t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
addEventListener('keydown',e=>{
  if(typing(e.target))return;
  if(G.state==='playing'){
    if(KM[e.code]){keys[KM[e.code]]=true;e.preventDefault()}
    else if(e.code==='Space'){if(!e.repeat)P.jb=.12;e.preventDefault()}
  }else if(G.state==='ready'&&(e.code==='Enter')&&gameVisible){startGame()}
});
addEventListener('keyup',e=>{if(KM[e.code])keys[KM[e.code]]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
document.querySelectorAll('#controls [data-k]').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}keys[k]=true;b.classList.add('on')};
  const off=e=>{keys[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,off));
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
{const j=$('#jumpBtn');
  j.addEventListener('pointerdown',e=>{e.preventDefault();try{j.setPointerCapture(e.pointerId)}catch(_){}P.jb=.14;j.classList.add('on');initAudio()});
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>j.addEventListener(n,()=>j.classList.remove('on')));
  j.addEventListener('contextmenu',e=>e.preventDefault());}
$('#controls').addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

/* mute */
$('#muteBtn').addEventListener('click',e=>{
  muted=!muted;const ic=$('#muteIco'),n=new Image();n.src=spr(muted?'spkOff':'spkOn').toDataURL();n.width=ic.width;n.height=ic.height;n.className='sp';n.id='muteIco';n.alt='';ic.replaceWith(n);e.currentTarget.blur();
});

/* ---------- start / win / unlock ---------- */
function startGame(){
  if(G.state==='playing')return;
  initAudio();
  resetGame();G.state='playing';P.inv=2.2;
  $('#ov').hidden=true;
}
$('#ovBtn').addEventListener('click',startGame);
$('#heroStart').addEventListener('click',()=>{
  initAudio();
  $('#game').scrollIntoView({behavior:'smooth',block:'start'});
  setTimeout(startGame,350);
});

function unlockInvitation(){
  if(unlocked)return;unlocked=true;

function showWin(){
  $('#winModal').hidden=false;
  const c=$('#confetti');c.hidden=false;c.innerHTML='';
  const cols=['#F04491','#FFE45C','#65C4E8','#70D34E','#A8A5F0','#FF8A3D','#FFFDF7'];
  for(let i=0;i<70;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=cols[i%cols.length];
    const d=2.4+Math.random()*2.6;e.style.animationDuration=d+'s';e.style.animationTimingFunction='steps('+(18+(Math.random()*12|0))+')';e.style.animationDelay=Math.random()*1.2+'s';c.appendChild(e)}

  const auto=setTimeout(goInvite,7000);
  $('#openInv').onclick=()=>{clearTimeout(auto);goInvite()};
}

  $('#ovBtn').innerHTML='<span class="en">PLAY AGAIN</span><span>العب مرة أخرى</span>';
  $('#ov').hidden=false;G.state='ready';
  $('#invitation').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------- RSVP → WhatsApp ---------- */
const WA_NUMBER='9647736398136'; // 07736398136
const MAPS_URL='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('قاعة بارادايس السيدية شارع قطر الندى بغداد');
function toast(msg,ms=3200){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,ms)}
function initRSVP(){
  const form=$('#rsvpForm'),cnt=$('#count');let n=1;
  $('#plus').onclick=()=>{n=Math.min(10,n+1);cnt.textContent=n};
  $('#minus').onclick=()=>{n=Math.max(1,n-1);cnt.textContent=n};
  const setCountState=()=>{const no=form.st.value==='no';$('#fCount').style.opacity=no?.35:1;$('#fCount').style.pointerEvents=no?'none':'auto'};
  form.querySelectorAll('input[name=st]').forEach(r=>r.addEventListener('change',setCountState));
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const name=$('#gName').value.trim();
    if(!name){const f=$('#fName');f.classList.remove('err');void f.offsetWidth;f.classList.add('err');$('#gName').focus();toast('الرجاء كتابة اسم الضيف');return}
    const yes=form.st.value==='yes';
    const msg=yes
      ?`السلام عليكم، أنا ${name}.\nأؤكد حضوري لحفل زفاف عبدالله و سمية يوم السبت 12/12/2026.\nعدد الحضور: ${n}`
      :`السلام عليكم، أنا ${name}.\nأعتذر عن الحضور لحفل زفاف عبدالله و سمية، ومبروك مقدماً.`;
    const url='https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(msg);
    $('#fbLink').href=url;$('#fallback').hidden=false;
    toast('تم تجهيز رسالتك، جاري فتح واتساب...');
    const w=window.open(url,'_blank');if(!w)location.href=url;
  });
}
